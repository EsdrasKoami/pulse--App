name: pulse-cegeptr

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME="Pulse — CEGPTR"
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
    volumes:
      - pulse_database:/var/www/html/database
      - pulse_storage:/var/www/html/storage

volumes:
  pulse_database:
    driver: local
  pulse_storage:
    driver: local
